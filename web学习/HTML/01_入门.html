<!-- 
    HTML 页面结构说明：
    <html>       - 根标签，整个网页的最外层容器
    <head>       - 头部区域，放网页的配置信息（不会显示在页面上）
    <body>       - 主体区域，放网页的可见内容
-->
<html>
    <!-- ========== 头部：网页的"身份信息" ========== -->
    <head>
        <!-- 网页标题，会显示在浏览器标签页上 -->
        <title>HTML入门</title>
    </head>

    <!-- ========== 主体：网页的"可见内容" ========== -->
    <body>
        <!-- h1 是最重要的一级标题，一个页面通常只有一个 -->
        <h1>Hello World!</h1>
    </body>
</html>
