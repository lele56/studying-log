<!-- 
    新闻正文 — 学习内容标签：
    <p>    段落标签（块级，自动换行，上下有间距）
    <br>   换行标签（自闭合，没有</br>，插在哪就在哪换行）
    <video> 视频标签（src+controls 就能播）
    <audio> 音频标签（用法同 video）
    
    块级 vs 行内元素对比：
    块级（<p> <h1> <div>）   → 独占一行，自动换行
    行内（<span> <a>）       → 不换行，在一行内流动
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【新闻】</title>

    <style>
        /* ===== ① 元素选择器：直接用标签名，选中页面上所有同名标签 ===== */
        span {
            color: #b2b2b2;
        }
        /* 去掉 <a> 链接默认的下划线 */
        a {
            text-decoration: none;
        }

        /* ===== ② 类选择器：. 开头，选中所有 class="xxx" 的元素 ===== */
        .cls {
            color: red;
        }

        /* ===== ③ ID 选择器：# 开头，选中 id="xxx" 的元素（页面唯一） ===== */
        #time {
            color: #b2b2b2;
        }
    </style>
</head>

<!-- ========== 主体：新闻内容区 ========== -->
<body>
    <h1>【新闻】</h1>
    
    <a href="https://www.cctv.com" target="_blank" title="点击访问央视网">央视网</a>

    <span class="cls" id="time">2026-09-30</span>

    <!--
        ====== 新闻正文区 ======
        下面用到了三种内容标签：
    -->

    <!--
        <br>：自闭合标签，没有结束标签！
        作用就是在当前位置换一行，类似 Word 里的回车
    -->
    <br>

    <!--
        多媒体占位符（取消注释即可使用）：

        <video> 常用属性：
        src      = "视频地址"    视频文件路径
        controls                 显示播放控件（进度条、音量等）
        autoplay                 自动播放（浏览器常拦截，不推荐）
        loop                     循环播放
        width    = "值"          视频宽度，高度自动按比例缩放
                                    px（像素）：绝对单位   → width="600"  固定 600px 宽
                                    %（百分比）：相对单位  → width="100%" 占满父容器整行
    -->
    <!-- <video src="视频地址" controls width="600"></video> -->
    <!-- <audio src="音频地址" controls></audio> -->

    <!--
        <p>：段落标签（块级元素）
        - 自动在段落前后换行，上下有默认间距
        - 对比 <span>：<span> 不换行，<p> 会换行
    -->
    <p>
        新闻正文内容
    </p>

</body>
</html>
