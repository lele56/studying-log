<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 事件监听</title>
    <style>
        body { margin: 0; background: #f5f0eb; font-family: "Microsoft YaHei",sans-serif; }
        .box { max-width: 500px; margin: 40px auto; }
        .card { background: #fff; border: 2px solid #d4a574; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
        h2 { margin: 0 0 12px; color: #5c3d2e; }
        button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; background: #d4a574; color: #fff; margin: 2px; }
        button:hover { background: #b8895a; }
        input { padding: 6px 10px; border: 1px solid #d4a574; border-radius: 4px; outline: none; margin: 4px; }
        .result { background: #f9f5f0; padding: 10px; border-radius: 4px; margin-top: 10px; font-size: 14px; color: #5c3d2e; min-height: 20px; }
        .event-box { width: 100px; height: 100px; background: #d4a574; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; user-select: none; }
    </style>
</head>
<body>

<div class="box">

    <!-- 1. click 点击 -->
    <div class="card">
        <h2>1. click 点击事件</h2>
        <button id="btn1">点我</button>
        <div class="result" id="r1">还没点击</div>
    </div>

    <!-- 2. input 实时输入 -->
    <div class="card">
        <h2>2. input 输入事件（实时）</h2>
        <input id="inp" placeholder="输入文字试试">
        <div class="result" id="r2">你输入的内容会实时显示</div>
    </div>

    <!-- 3. keydown 按键 -->
    <div class="card">
        <h2>3. keydown 按键事件</h2>
        <input id="keyInp" placeholder="按下任意键">
        <div class="result" id="r3">你按了什么键？</div>
    </div>

    <!-- 4. mouse 鼠标移入移出 -->
    <div class="card">
        <h2>4. mouseenter / mouseleave</h2>
        <div class="event-box" id="box">摸我</div>
        <div class="result" id="r4">鼠标不在上面</div>
    </div>

    <!-- 5. 事件委托（父元素监听所有子元素） -->
    <div class="card">
        <h2>5. 事件委托</h2>
        <div id="btnGroup">
            <button data-skill="八极崩">八极崩</button>
            <button data-skill="焰分噬浪尺">焰分噬浪尺</button>
            <button data-skill="佛怒火莲">佛怒火莲</button>
        </div>
        <div class="result" id="r5">点击上面技能</div>
    </div>

</div>

<script>
    /*
    ★ 事件 = 用户做了什么 → 浏览器叫 JS 来处理

    绑定方式：
      ① onclick="fn()"        →  写在 HTML 里（简单）
      ② el.addEventListener()  →  写在 JS 里（推荐，解耦）

    常用事件：
      click      鼠标点击     input      输入内容变化
      keydown    按下键盘      change     下拉框/复选框改变
      mouseenter 鼠标移入      submit     表单提交
    */


    // 1. click
    document.querySelector('#btn1').addEventListener('click', function() {
        document.querySelector('#r1').innerText = '你点击了按钮！';
    });

    // 2. input —— 输入框内容每变一次就触发
    document.querySelector('#inp').addEventListener('input', function() {
        document.querySelector('#r2').innerText = '输入中：' + this.value;
        // this = 触发事件的元素（即 #inp）
    });

    // 3. keydown —— 参数 e 是事件对象，携带键盘信息
    document.querySelector('#keyInp').addEventListener('keydown', function(e) {
        document.querySelector('#r3').innerText =
            '你按了：' + e.key + '（键码：' + e.keyCode + '）';
    });

    // 4. mouseenter / mouseleave
    let box = document.querySelector('#box');
    box.addEventListener('mouseenter', function() {
        document.querySelector('#r4').innerText = '鼠标移进来了！';
        this.style.background = '#b8895a';
    });
    box.addEventListener('mouseleave', function() {
        document.querySelector('#r4').innerText = '鼠标移出去了';
        this.style.background = '#d4a574';
    });

    /*
    5. 事件委托 —— 不给每个子元素单独绑定，只监听父元素
       优点：动态添加的子元素也能自动响应
    */
    document.querySelector('#btnGroup').addEventListener('click', function(e) {
        // e.target = 真正被点击的那个元素
        if (e.target.tagName === 'BUTTON') {
            let skill = e.target.getAttribute('data-skill');
            document.querySelector('#r5').innerText = '发动技能：' + skill + '！';
        }
    });


    /*
    ★ 事件核心速查：
      el.addEventListener('事件名', 回调函数)
      e.target          →  谁被点了（事件源头）
      this              →  监听事件的元素（事件绑定者）
      e.key             →  按了哪个键
      e.preventDefault() →  阻止默认行为（如表单提交、链接跳转）
    */
</script>

</body>
</html>
