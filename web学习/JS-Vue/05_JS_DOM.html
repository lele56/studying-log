<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS DOM 操作</title>
    <style>
        body { margin: 0; background: #f5f0eb; font-family: "Microsoft YaHei",sans-serif; }
        .box { max-width: 500px; margin: 40px auto; }
        .card { background: #fff; border: 2px solid #d4a574; border-radius: 8px; padding: 20px; margin-bottom: 16px; text-align: center; }
        h2 { margin: 0 0 8px; color: #5c3d2e; }
        p  { color: #8b6914; }
        button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; margin: 4px; font-size: 14px; background: #d4a574; color: #fff; }
        button:hover { background: #b8895a; }
        .btn-del { background: #c0392b; font-size: 12px; padding: 2px 10px; }
        .btn-del:hover { background: #a93226; }
        li { background: #fff; border: 1px solid #e0d5c7; border-radius: 4px; padding: 8px 14px; margin: 4px 0; display: flex; justify-content: space-between; align-items: center; }
        input { padding: 6px 10px; border: 1px solid #d4a574; border-radius: 4px; outline: none; }
    </style>
</head>
<body>

<div class="box">

    <!-- 演示1：切换内容 -->
    <div class="card">
        <h2 id="name">萧炎</h2>
        <p id="info">斗之气 · 三段</p>
        <button onclick="switchChar()">切换角色</button>
    </div>

    <!-- 演示2：增删元素 -->
    <div class="card">
        <h2>技能列表</h2>
        <ul id="list">
            <li>八极崩 <button class="btn-del" onclick="this.parentElement.remove()">×</button></li>
        </ul>
        <input id="skillInput" placeholder="输入新技能">
        <button onclick="addSkill()">添加</button>
    </div>

    <!-- 演示3：改样式 -->
    <div class="card">
        <p id="text">点击按钮改变我</p>
        <button onclick="document.querySelector('#text').style.color='#c0392b'">红色</button>
        <button onclick="document.querySelector('#text').style.fontSize='24px'">变大</button>
        <button onclick="let t=document.querySelector('#text');t.style.display=t.style.display==='none'?'block':'none'">隐藏</button>
    </div>

</div>

<script>
    /*
    ★ DOM = JS 操作 HTML 的桥梁
      querySelector('选择器')      → 找第一个匹配元素
      querySelectorAll('选择器')   → 找所有匹配元素（数组）
      .innerText     → 读/写文字
      .style.xxx     → 读/写样式
      .remove()      → 删除元素
      createElement / appendChild → 创建/添加元素
    */

    // 切换角色
    let chars = ['萧炎', '药老', '纳兰嫣然', '云韵'];
    let i = 0;
    function switchChar() {
        i = (i + 1) % chars.length;
        document.querySelector('#name').innerText = chars[i];
        document.querySelector('#info').innerText = '点击了 ' + (i + 1) + ' 次';
    }

    // 添加技能
    function addSkill() {
        let input = document.querySelector('#skillInput');
        let val = input.value.trim();
        if (!val) return;

        let li = document.createElement('li');
        li.innerHTML = val + ' <button class="btn-del" onclick="this.parentElement.remove()">×</button>';
        document.querySelector('#list').appendChild(li);

        input.value = '';
        input.focus();
    }
</script>

</body>
</html>
